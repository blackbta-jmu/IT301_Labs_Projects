<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const site = 'https://randomuser.me/api/';
        let img = document.createElement('img');
        let name = document.createElement('div')
        let email = document.createElement('div')
        let phone = document.createElement('div')
        let bttn = document.createElement('button');
        bttn.type = 'button';
        bttn.textContent = 'Generate Profile'
        let form = document.createElement('form');
        form.action = '#';
        form.appendChild(bttn);
        document.body.appendChild(form);
        document.body.appendChild(name);
        document.body.appendChild(email);
        document.body.appendChild(phone);
        const getProfile = async()=>{
            try {
                let response = await fetch('https://randomuser.me/api/')
                if (!response.ok)
                {
                    throw new Error(`Response status: ${response.status}`);
                }
                let result = await response.json();
                const person = result.results[0];
                img.src = person.picture.medium;
                console.log(person.picture.large);
                img.alt ='Random profile picture';
                document.body.appendChild(img);
                name.textContent = `Name: ${person.name.first} ${person.name.last}`;
                email.textContent = `Email: ${person.email}`;
                phone.textContent = `Phone: ${person.phone}`;
            } catch (reason) {
                console.log(reason);
            }
        }
        bttn.addEventListener('click', getProfile)
        getProfile();
    </script>
</body>
</html>
